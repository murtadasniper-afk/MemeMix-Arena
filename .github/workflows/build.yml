name: Build MemeMix Arena APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "MemeMix Arena" "com.mememix.arena" --web-dir www
          npx cap add android

      - name: Align Kotlin versions
        working-directory: android
        run: |
          echo "kotlinVersion=1.8.22" >> gradle.properties
          sed -i 's/kotlin-stdlib-jdk7:1.6.21/kotlin-stdlib:1.8.22/g' app/build.gradle

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MemeMix-Arena-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
